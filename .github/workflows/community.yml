name: Community Integration
on:
  workflow_dispatch:
  push:
    paths: ['scripts/test-community-live.cjs']
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-community-live.cjs
