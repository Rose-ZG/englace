name: iOS Simulator Build
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'mobile.*', 'scripts/build-ios-web.cjs']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-ios-web.cjs
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/Englace.xcodeproj -scheme Englace -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Englace-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Englace.app
